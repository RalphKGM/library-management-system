{% extends "base.html" %}
{% block title %}Add copy · The Reading Room{% endblock %}
{% block content %}
<section class="librarian-page shell narrow-admin">
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="{{ url_for('librarian') }}">Catalog management</a><span>/</span><span aria-current="page">Add copy</span></nav>
  <div class="admin-heading"><div><span class="eyebrow">Physical inventory</span><h1>Add a copy</h1><p>{{ work.title }}</p></div></div>
  <form class="admin-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><div class="field span-2"><label for="quantity">How many copies?</label><input id="quantity" name="quantity" type="number" min="1" max="500" value="{{ request.form.get('quantity', '1') }}" required><p class="field-help">Each copy gets a unique library ID automatically. You can add up to 500 at once.</p></div></div><div class="form-actions"><a class="button button-secondary" href="{{ url_for('librarian_copies') }}">Cancel</a><button class="button" type="submit"><span aria-hidden="true">＋</span> Add copies</button></div></form>
</section>
{% endblock %}
