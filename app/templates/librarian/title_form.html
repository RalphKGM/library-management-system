{% extends "base.html" %}
{% block title %}{{ mode }} title · The Reading Room{% endblock %}
{% block content %}
<section class="librarian-page shell narrow-admin">
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="{{ url_for('librarian') }}">Catalog management</a><span>/</span><span aria-current="page">{{ mode }} title</span></nav>
  <div class="admin-heading"><div><span class="eyebrow">Title record</span><h1>{{ mode }} title</h1><p>Help readers find this work on the shelf.</p></div></div>
  <form class="admin-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
    <div class="field span-2"><label for="title">Title</label><input id="title" name="title" value="{{ request.form.get('title', work.title if work else '') }}" required></div>
    <div class="field span-2"><label for="author">Author or creator</label><input id="author" name="author" value="{{ request.form.get('author', work.author if work else '') }}" required></div>
    <div class="field"><label for="category">Category</label><select id="category" name="category">{% for category in categories %}<option value="{{ category }}" {% if request.form.get('category', work.category if work else '') == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div>
    <div class="field"><label for="volume">Volume or issue</label><input id="volume" name="volume" value="{{ request.form.get('volume', work.volume if work else '') or '' }}"></div>
    <div class="field"><label for="progress_unit">Reading unit</label><select id="progress_unit" name="progress_unit"><option value="page" {% if request.form.get('progress_unit', work.progress_unit if work else 'page') == 'page' %}selected{% endif %}>Page</option><option value="chapter" {% if request.form.get('progress_unit', work.progress_unit if work else 'page') == 'chapter' %}selected{% endif %}>Chapter</option></select></div>
    <div class="field"><label for="total_units">Total pages or chapters</label><input id="total_units" name="total_units" type="number" min="1" value="{{ request.form.get('total_units', work.total_units if work and work.total_units else '') }}"></div>
    <div class="field span-2"><label for="description">Description</label><textarea id="description" name="description" rows="5" maxlength="2000">{{ request.form.get('description', work.description if work else '') }}</textarea></div>
  </div><div class="form-actions"><a class="button button-secondary" href="{{ url_for('librarian') }}">Cancel</a><button class="button" type="submit">Save title</button></div></form>
</section>
{% endblock %}
